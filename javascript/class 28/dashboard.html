<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
      }

      .sidebar {
        min-height: 100vh;
        background: #212529;
      }

      .sidebar a {
        color: white;
        text-decoration: none;
        display: block;
        padding: 12px 15px;
        border-radius: 5px;
      }

      .sidebar a:hover {
        background: #343a40;
      }

      .card {
        border: none;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
          <h3 class="text-white text-center mb-4">Dashboard</h3>

          <a href="#">🏠 Home</a>
          <a href="#">👤 Users</a>
          <a href="#">📦 Products</a>
          <a href="#">📊 Reports</a>
          <a href="#">⚙ Settings</a>
          <button class="btn btn-danger" onclick="logout()" href="">🚪 Logout</button>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">
          <!-- Navbar -->
          <nav class="navbar navbar-light bg-white shadow-sm px-3">
            <span class="navbar-brand mb-0 h4">
              Welcome
              <script>
                document.write(localStorage.getItem("name"));
              </script>
            </span>
          </nav>

          <!-- Cards -->
          <div class="container mt-4">
            <div class="row g-4">
              <div class="col-md-4">
                <div class="card shadow p-4 text-center">
                  <h5>Total Users</h5>
                  <h2>1,250</h2>
                </div>
              </div>

              <div class="col-md-4">
                <div class="card shadow p-4 text-center">
                  <h5>Total Orders</h5>
                  <h2>540</h2>
                </div>
              </div>

              <div class="col-md-4">
                <div class="card shadow p-4 text-center">
                  <h5>Total Revenue</h5>
                  <h2>$12,500</h2>
                </div>
              </div>
            </div>

            <!-- Table -->
            <div class="card shadow mt-5">
              <div class="card-header bg-primary text-white">Recent Users</div>

              <div class="card-body">
                <table class="table table-striped">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Status</th>
                    </tr>
                  </thead>

                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>Ali</td>
                      <td>ali@gmail.com</td>
                      <td>
                        <span class="badge bg-success"> Active </span>
                      </td>
                    </tr>

                    <tr>
                      <td>2</td>
                      <td>Ahmed</td>
                      <td>ahmed@gmail.com</td>
                      <td>
                        <span class="badge bg-warning"> Pending </span>
                      </td>
                    </tr>

                    <tr>
                      <td>3</td>
                      <td>Saad</td>
                      <td>saad@gmail.com</td>
                      <td>
                        <span class="badge bg-danger"> Blocked </span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


    <script src="app.js"></script>
  </body>
</html>
