<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>

        #products {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
        }

        .abc img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .abc{
            padding: 10px;
            border: 2px solid black;
            width: 25%;
            text-align: center;
            height: 400px;
        }

        @media screen and (max-width: 400px) {
            #products {
                display: flex;
                flex-wrap: wrap;
            }
            .abc {
                width: 90%;
                margin: 20px;
            }
        }

    </style>

  </head>
  <body>
    <div id="products"></div>
    <script src="app.js"></script>
  </body>
</html>
